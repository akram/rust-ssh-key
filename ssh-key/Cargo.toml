[package]
name = "ssh-key"
version = "0.7.0-rc.12"
description = """
Pure Rust implementation of SSH key file format decoders/encoders as described
in RFC4251/RFC4253 and OpenSSH key formats, as well as "sshsig" signatures and
certificates (including certificate validation and certificate authority support),
with further support for the `authorized_keys` and `known_hosts` file formats.
"""
authors = ["RustCrypto Developers"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/RustCrypto/SSH/tree/master/ssh-key"
repository = "https://github.com/RustCrypto/SSH"
categories = ["authentication", "cryptography", "encoding", "no-std", "parser-implementations"]
keywords = ["crypto", "certificate", "openssh", "ssh", "sshsig"]
readme = "README.md"
edition = "2024"
rust-version = "1.87"

[dependencies]
cipher = { package = "ssh-cipher", version = "0.3", features = ["encoding", "zeroize"] }
ctutils = { version = "0.4.8", default-features = false }
encoding = { package = "ssh-encoding", version = "0.3", features = ["base64", "digest", "pem", "ctutils", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
signature = { version = "3", default-features = false }
zeroize = { version = "1.9", default-features = false }

# optional dependencies
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc"] }
bcrypt-pbkdf = { version = "0.11", optional = true, default-features = false, features = ["alloc"] }
dsa = { version = "0.7", optional = true, default-features = false, features = ["hazmat"] }
ed25519-dalek = { version = "3", optional = true, default-features = false }
hex = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
hmac = { version = "0.13", optional = true }
p256 = { version = "0.14", optional = true, default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", optional = true, default-features = false, features = ["ecdsa"] }
p521 = { version = "0.14", optional = true, default-features = false, features = ["ecdsa"] }
openssl = { version = "0.10", optional = true }
rand_core = { version = "0.10", optional = true, default-features = false }
rsa = { version = "0.10", optional = true, default-features = false, features = ["pkcs1v15"] }
sec1 = { version = "0.8", optional = true, default-features = false, features = ["point"] }
serde = { version = "1.0.16", optional = true }
sha1 = { version = "0.11", optional = true, default-features = false, features = ["oid"] }

[dev-dependencies]
hex-literal = "1"
chacha20 = { version = "0.10", features = ["rng"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

[features]
default = ["ecdsa", "rand_core", "std"]
alloc = ["encoding/alloc", "signature/alloc", "zeroize/alloc", ]
std = ["alloc"]

crypto = ["ed25519", "p256", "p384", "p521", "rsa"] # NOTE: `dsa` is obsolete/weak
dsa = ["dep:dsa", "dep:sha1", "alloc", "encoding/bigint", "signature/rand_core"]
ecdsa = ["dep:sec1"]
ed25519 = ["dep:ed25519-dalek", "rand_core"]
encryption = [
    "dep:bcrypt-pbkdf",
    "alloc",
    "cipher/aes",
    "cipher/chacha20poly1305",
    "rand_core"
]
getrandom = ["cipher/getrandom", "rand_core"]
# Sign/verify Ed25519, ECDSA (P-256/P-384/P-521) and RSA via system OpenSSL
# (openssl-sys) instead of ed25519-dalek/p256/p384/p521/rsa, for environments
# that require all cryptographic operations to go through a FIPS-certifiable
# OpenSSL build. Pulls in `ecdsa` for the EcdsaKeypair/EcdsaPublicKey types
# (Ed25519's and RSA's equivalents are not feature-gated); this only swaps
# the signing/verification backend, not key storage/encoding. Also routes
# `encryption`/`ppk`'s AES-CBC/CTR/GCM (ssh-cipher's `aes` marker) through
# OpenSSL instead of RustCrypto.
openssl = ["dep:openssl", "std", "ecdsa", "cipher/openssl"]
# Explicit opt-in for ssh-cipher's RustCrypto AES-CBC/CTR/GCM backend, not
# implied by `encryption`/`ppk` alone -- a consumer picks this when it
# wants that backend (as opposed to `openssl`, above). See RHOAIENG-97009.
aes-rust-crypto = ["cipher/aes-rust-crypto"]
p256 = ["dep:p256", "ecdsa"]
p384 = ["dep:p384", "ecdsa"]
p521 = ["dep:p521", "ecdsa"]
ppk = ["dep:hex", "alloc", "cipher/aes", "dep:hmac", "dep:argon2", "dep:sha1"]
rand_core = ["dep:rand_core", "cipher/rand_core"]
# Backend-agnostic: RSA key *type* support (Mpint-based storage, no
# RustCrypto `rsa` crate needed for that by itself). `rsa-rust-crypto`
# below is the separate, explicit opt-in for the RustCrypto backend;
# `openssl` has its own sign/verify/keygen/format path and doesn't need
# either.
rsa = ["alloc", "encoding/bigint", "rand_core"]
rsa-rust-crypto = ["rsa", "dep:rsa"]
sha1 = ["dep:sha1"]
tdes = ["cipher/tdes", "encryption"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
